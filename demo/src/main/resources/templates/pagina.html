<!DOCTYPE html>
<html lang="es" xmlns="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="mb-3 fw-bold text-primary">Consultar DNI</h2>
    <hr>
    <form th:action="@{/buscar}" method="post" class="row g-2">
        <div class="col-auto">
            <input type="text" name="dni" class="form-control" required>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Buscar</button>
        </div>
    </form>

    <!-- Mostrar Error -->
    <div th:if="${error}" class="alert alert-danger mt-3">
        <span th:text="${error}"></span>
    </div>

    <!-- Mostrar datos si existen -->
    <div th:if="${nombres}" class="mt-4">
        <h4>Datos Encontrados:</h4>
        <ul class="list-group">
            <li class="list-group-item"><strong>DNI:</strong> <span th:text="${dni}"></span></li>
            <li class="list-group-item"><strong>Nombres:</strong> <span th:text="${nombres}"></span></li>
            <li class="list-group-item"><strong>Apellido Paterno:</strong> <span th:text="${apePat}"></span></li>
            <li class="list-group-item"><strong>Apellido Materno:</strong> <span th:text="${apeMat}"></span></li>
        </ul>
    </div>
</div>
</body>
</html>
